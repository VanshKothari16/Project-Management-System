spring.application.name=taskmanagement
server.port=${PORT:9090}

jwt.secret.key=${JWT_KEY:changeme-generate-a-long-random-string-for-real-use}
jwt.expiry=3600000

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.dialect=${DIALECT:org.hibernate.dialect.MySQLDialect}

spring.datasource.hikari.maximum-pool-size=20
hibernate.query.fail_on_duplicate = false
